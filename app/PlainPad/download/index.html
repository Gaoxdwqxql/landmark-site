<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f8fc">
<title>PlainPad 下载</title>
<meta name="description" content="PlainPad 官方下载页。重构大文件渲染，支持沉浸阅读、更多编码与密钥加密。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 108 108'%3E%3Cpath fill='%236750A4' d='M20,0 L88,0 A20,20 0 0 1 108,20 L108,88 A20,20 0 0 1 88,108 L20,108 A20,20 0 0 1 0,88 L0,20 A20,20 0 0 1 20,0 z'/%3E%3Cpath fill='%23fff' d='M32,26 L66,26 L82,42 L82,82 A3,3 0 0 1 79,85 L32,85 A3,3 0 0 1 29,82 L29,29 A3,3 0 0 1 32,26 z'/%3E%3Cpath fill='%23E0E0E0' d='M66,26 L66,42 L82,42 z'/%3E%3Cpath fill='%236750A4' d='M40,52 L44,52 L44,74 L40,74 z M50,52 L74,52 L74,56 L50,56 z M50,60 L74,60 L74,64 L50,64 z M50,68 L64,68 L64,72 L50,72 z'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#f6f8fc; --card:#fff; --border:#e5eaf2; --border-2:#d3dbe8;
    --text:#16213a; --muted:#6b7891; --faint:#9aa7bd;
    
    --color-pages: #5B65F5;
    --color-mirror: #0EA5E9;
    --color-lanzou: #F97316;
    --color-gh: #64748B;
    
    --color-fast: #10B981;
    --color-fast-bg: #ECFDF5;
    
    --color-success: #10B981;
    --color-error: #EF4444;
    --color-warn: #F59E0B;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--text); line-height:1.6; min-height:100vh;
    -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
    padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right);
    background:var(--bg);
  }
  a{color:inherit}
  button{font-family:inherit}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .wrap{max-width:720px;margin:0 auto;padding:0 18px 56px}
  
  /* 返回按钮 */
  .back-link{
    display:inline-flex;align-items:center;gap:5px;
    margin-top:18px;padding:4px 0;font-size:13px;color:var(--faint);
    text-decoration:none;transition:all .2s ease;touch-action:manipulation;
  }
  .back-link svg{width:14px;height:14px;flex:none;transition:transform .2s ease}
  .back-link:hover{color:var(--muted)}
  .back-link:hover svg{transform:translateX(-2px)}

  /* 头部 */
  .hero{text-align:center;padding:26px 0 24px}
  .logo{width:58px;height:58px;margin:0 auto 14px;filter:drop-shadow(0 8px 16px rgba(91,101,245,.25))}
  .logo svg{display:block;width:100%;height:100%}
  .hero h1{font-size:27px;font-weight:700;letter-spacing:-.5px}
  .sub{color:var(--muted);font-size:14px;margin-top:4px}
  .meta{color:var(--faint);font-size:12px;margin-top:10px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
  .meta span{display:inline-flex;align-items:center;gap:6px}
  .meta span+span::before{content:"·";color:var(--border-2)}
  .meta a{color:inherit;text-decoration:none;border-bottom:1px dotted var(--border-2);transition:all .2s}
  .meta a:hover{color:var(--muted);border-bottom-color:var(--muted)}

  /* 提示条 */
  .notice{
    display:flex;align-items:flex-start;gap:9px;
    margin-top:6px;padding:11px 14px;
    background:#F0F4FF;
    border:1px solid #D6E0FF; border-left:3px solid var(--color-pages);
    border-radius:10px; font-size:12.5px;color:var(--muted);line-height:1.65;
  }
  .notice svg{flex:none;width:15px;height:15px;margin-top:3px;color:var(--color-pages)}
  .notice p{margin:0}
  .notice strong{color:#3d4a63;font-weight:600}
  .notice a{color:var(--color-pages);text-decoration:none;font-weight:500;}
  .notice a:hover{text-decoration:underline;}

  /* 骨架屏 */
  .skeleton { background: #eef1f7; border-radius: 6px; animation: pulse 1.5s infinite ease-in-out; }
  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: .4; } 100% { opacity: 1; } }
  .skeleton-text { height: 16px; margin-bottom: 8px; }
  .skeleton-title { height: 26px; width: 120px; margin-bottom: 12px; }

  /* 最新版卡片 */
  .dl-card{
    margin-top:12px;background:var(--card);border:1px solid var(--border);
    border-radius:18px;padding:22px;box-shadow:0 4px 16px -8px rgba(16,24,40,.08);
    position: relative; transition: border-color .2s;
  }
  .dl-top{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
  .badge{
    display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;
    color:var(--color-pages);background:#F0F4FF;
    border:1px solid #D6E0FF;
    padding:2px 9px;border-radius:999px;
  }
  .badge-pre{color:var(--color-warn);background:#FFFBEB;border-color:#FEF3C7}
  .dl-info h2{font-size:26px;font-weight:700;letter-spacing:-.4px;margin-top:6px;display:flex;align-items:baseline;gap:8px}
  .dl-note{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.5}
  
  /* 下载按钮 */
  .dl-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:11px 20px;border-radius:11px;font-size:14px;font-weight:600;
    text-decoration:none;border:1px solid transparent;
    transition:all .2s ease; cursor:pointer; touch-action:manipulation; position:relative;
    outline: none;
  }
  .btn:active { transform: scale(0.96); }
  
  .btn-pages{color:#fff;background:var(--color-pages);box-shadow:0 4px 12px -4px rgba(91,101,245,.4)}
  .btn-pages:hover{background:#4A54E1;transform:translateY(-1px);box-shadow:0 6px 16px -4px rgba(91,101,245,.5)}
  
  .btn-mirror{color:#fff;background:var(--color-mirror);box-shadow:0 4px 12px -4px rgba(14,165,233,.4)}
  .btn-mirror:hover{background:#0284C7;transform:translateY(-1px);box-shadow:0 6px 16px -4px rgba(14,165,233,.5)}
  
  .btn-lanzou{color:#fff;background:var(--color-lanzou);box-shadow:0 4px 12px -4px rgba(249,115,22,.4)}
  .btn-lanzou:hover{background:#EA580C;transform:translateY(-1px);box-shadow:0 6px 16px -4px rgba(249,115,22,.5)}

  /* 最快线路按钮特效 */
  .btn.fast {
    background: var(--color-fast) !important;
    box-shadow: 0 0 0 4px var(--color-fast-bg), 0 6px 16px -4px rgba(16,185,129,.5) !important;
    animation: fastPulse 2s infinite;
    transform: translateY(-1px);
  }
  .btn.fast::after {
    content: "⚡ 最快";
    position: absolute; top: -10px; right: -10px;
    background: #fff; color: var(--color-fast);
    font-size: 10px; font-weight: 800;
    padding: 2px 6px; border-radius: 6px;
    border: 1px solid var(--color-fast);
    box-shadow: 0 2px 6px rgba(16,185,129,.3);
    animation: bounceIn .4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 10;
  }
  @keyframes fastPulse {
    0% { box-shadow: 0 0 0 0 rgba(16,185,129,.3), 0 6px 16px -4px rgba(16,185,129,.5); }
    70% { box-shadow: 0 0 0 8px rgba(16,185,129,0), 0 6px 16px -4px rgba(16,185,129,.5); }
    100% { box-shadow: 0 0 0 0 rgba(16,185,129,0), 0 6px 16px -4px rgba(16,185,129,.5); }
  }
  @keyframes bounceIn {
    0% { transform: scale(0); opacity: 0; }
    80% { transform: scale(1.1); opacity: 1; }
    100% { transform: scale(1); }
  }

  /* 测速模块 */
  .speed-section {
    margin-top: 16px; padding-top: 16px; border-top: 1px dashed var(--border);
  }
  .speed-btn {
    position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 12px; border-radius: 11px;
    background: #F8FAFC; border: 1px solid var(--border);
    color: var(--text); font-size: 14px; font-weight: 600;
    cursor: pointer; transition: all .3s ease; outline: none; touch-action: manipulation;
  }
  .speed-btn:hover { background: #F1F5F9; border-color: var(--border-2); }
  .speed-btn:active { transform: scale(0.98); }
  .speed-btn svg { width: 16px; height: 16px; color: var(--color-pages); flex: none; z-index: 2; }
  .speed-text { z-index: 2; display: flex; align-items: center; gap: 8px; }
  .speed-text b { color: var(--color-fast); font-weight: 700; }
  
  /* 测速进度条 */
  .speed-progress {
    position: absolute; left: 0; bottom: 0; height: 3px; width: 0%;
    background: var(--color-pages); transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    z-index: 1;
  }
  
  /* 测速状态 */
  .speed-btn.testing { background: #F0F4FF; border-color: #D6E0FF; color: var(--color-pages); cursor: progress; }
  .speed-btn.testing svg { color: var(--color-pages); }
  .speed-btn.testing .speed-progress { background: var(--color-pages); }
  
  .speed-btn.success { background: var(--color-fast-bg); border-color: #A7F3D0; color: #065F46; }
  .speed-btn.success svg { color: var(--color-fast); }
  .speed-btn.success .speed-progress { background: var(--color-fast); width: 100% !important; }
  
  /* 重新测速提示 */
  .speed-action {
    font-size: 11px; font-weight: 500; padding: 2px 6px; border-radius: 4px;
    background: rgba(0,0,0,0.05); color: var(--muted); margin-left: 4px;
    display: inline-flex; align-items: center; gap: 2px;
  }
  .speed-btn.success .speed-action {
    background: rgba(16,185,129,.15); color: var(--color-fast);
  }

  /* 底部辅助链接 */
  .dl-foot{
    display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;
    margin-top:14px; font-size:13px;
  }
  .link-muted{
    color:var(--faint);text-decoration:none;background:none;border:0;
    font-size:13px;cursor:pointer;padding:0 2px;border-bottom:1px dashed var(--border-2);
    transition:all .3s ease; display:inline-flex; align-items:center; gap:4px;
  }
  .link-muted:hover{color:var(--text);border-color:var(--text)}
  .link-muted.fast { color: var(--color-fast) !important; border-bottom: 1px solid var(--color-fast) !important; font-weight: 700; }

  /* 转圈动画 */
  .spinner {
    width: 14px; height: 14px; border: 2px solid rgba(91,101,245,.2);
    border-top-color: var(--color-pages); border-radius: 50%;
    animation: spin 0.8s linear infinite; display: inline-block; margin-right: 4px;
  }
  .spinner-white {
    border-color: rgba(255,255,255,.3); border-top-color: #fff;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* SHA 折叠区 */
  .sha-wrap{margin-top:10px}
  .sha-wrap summary{list-style:none;cursor:pointer;font-size:12px;color:var(--faint);display:inline-flex;align-items:center;gap:5px;user-select:none; transition:color .2s;}
  .sha-wrap summary::-webkit-details-marker{display:none}
  .sha-wrap summary::before{content:"▸";font-size:10px;transition:transform .2s}
  .sha-wrap[open] summary::before{transform:rotate(90deg)}
  .sha-wrap summary:hover{color:var(--text)}
  .sha-body{
    margin-top:8px;padding:10px 12px;background:#f8fafc;
    border:1px solid var(--border);border-radius:9px;
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  }
  .sha-body code{font-size:11px;color:#475569;word-break:break-all;line-height:1.5;flex:1;min-width:160px}
  .sha-missing{
    margin-top:10px;font-size:12px;color:var(--faint);
    background:#fafbfe;border:1px dashed var(--border-2);
    border-radius:8px;padding:8px 12px;display:inline-block;
  }
  .sha-warn{
    margin-top:10px;font-size:11.5px;color:var(--color-warn);
    background:#FFFBEB;border:1px solid #FEF3C7;
    border-radius:8px;padding:7px 11px;line-height:1.55;
  }
  .copy-btn{
    font:inherit;font-size:11.5px;padding:3px 10px;border-radius:6px;
    border:1px solid var(--border-2);background:#fff;color:var(--muted);
    cursor:pointer;flex:none;transition:all .2s; display:flex; align-items:center; gap:4px;
  }
  .copy-btn:hover{color:var(--color-pages);border-color:var(--color-pages);background:#F0F4FF}
  .copy-btn:active { transform: scale(0.95); }

  /* 历史版本列表 */
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:36px 0 12px}
  .sec-head h2{font-size:16px;font-weight:650}
  .pw{font-size:12.5px;color:var(--faint);display:inline-flex;align-items:center;gap:6px}
  .pw b{color:var(--text);font-family:ui-monospace,monospace;letter-spacing:.5px}
  
  .search-box{
    position:relative;display:flex;align-items:center;margin-bottom:10px;
    background:#fff;border:1px solid var(--border);border-radius:10px;
    padding:0 12px;transition:all .2s;
  }
  .search-box:focus-within{border-color:var(--color-pages);box-shadow:0 0 0 3px rgba(91,101,245,.1)}
  .search-box svg{flex:none;color:var(--faint);width:16px;height:16px}
  .search-box input{
    flex:1;border:0;outline:0;background:transparent;
    padding:10px 8px;font:inherit;font-size:14px;color:var(--text);min-width:0;
  }
  .search-box input::placeholder{color:var(--faint);font-size:13px}
  .search-box input::-webkit-search-cancel-button{display:none}
  .search-clear{
    flex:none;border:0;background:#f1f5f9;color:var(--muted);
    width:20px;height:20px;border-radius:50%;cursor:pointer;
    font-size:13px;line-height:1;display:grid;place-items:center;
    padding:0;transition:all .2s;
  }
  .search-clear:hover{background:#e2e8f0;color:var(--text)}

  .ver-list{list-style:none;display:grid;gap:8px}
  .ver-item{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;transition:border-color .2s, box-shadow .2s}
  .ver-item:hover { border-color: var(--border-2); box-shadow: 0 2px 10px -4px rgba(0,0,0,.05); }
  .ver-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .ver-title{display:flex;align-items:center;gap:7px}
  .ver-num{font-size:15px;font-weight:650;font-variant-numeric:tabular-nums}
  
  .tag{font-size:10.5px;padding:1px 7px;border-radius:999px;font-weight:500;line-height:1.7}
  .tag-latest{background:#ECFDF5;color:#065F46}
  .tag-pre{background:#FFFBEB;color:var(--color-warn)}
  .tag-none{background:#f1f5f9;color:var(--faint)}
  
  .ver-btns{display:flex;gap:6px;flex-wrap:wrap}
  .mini{
    font-size:12px;padding:5px 11px;border-radius:7px;
    text-decoration:none;border:1px solid var(--border-2);
    background:#fff;color:var(--muted);transition:all .2s;
    white-space:nowrap;display:inline-flex;align-items:center;gap:4px;
  }
  .mini:active { transform: scale(0.95); }
  .mini-pages{color:var(--color-pages);border-color:#D6E0FF;background:#F0F4FF}
  .mini-pages:hover{background:#E0E7FF;border-color:var(--color-pages)}
  .mini-mirror{color:var(--color-mirror);border-color:#BAE6FD;background:#F0F9FF}
  .mini-mirror:hover{background:#E0F2FE;border-color:var(--color-mirror)}
  .mini-lanzou{color:var(--color-lanzou);border-color:#FED7AA;background:#FFF7ED}
  .mini-lanzou:hover{background:#FFEDD5;border-color:var(--color-lanzou)}
  .mini-gh:hover{color:var(--text);border-color:var(--text);background:#f8fafc}
  
  .ver-sha{margin-top:6px}
  .ver-sha summary{list-style:none;cursor:pointer;font-size:11px;color:var(--faint);display:inline-flex;align-items:center;gap:4px;user-select:none; transition:color .2s;}
  .ver-sha summary::-webkit-details-marker{display:none}
  .ver-sha summary::before{content:"▸";font-size:9px;transition:transform .2s}
  .ver-sha[open] summary::before{transform:rotate(90deg)}
  .ver-sha summary:hover{color:var(--text)}
  .ver-sha .sha-body{margin-top:6px;padding:8px 10px}

  .empty-state{
    padding:36px 20px;text-align:center;color:var(--faint);font-size:14px;
    background:var(--card);border:1px dashed var(--border-2);border-radius:12px;list-style:none;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  }
  .empty-state svg { width: 32px; height: 32px; color:var(--border-2); }
  .empty-state b{color:var(--text);font-weight:600}
  
  .more{
    display:block;width:100%;margin-top:10px;padding:10px;border-radius:10px;
    border:1px dashed var(--border-2);background:transparent;
    color:var(--muted);font-size:13px;cursor:pointer;transition:all .2s;
  }
  .more:hover{background:#fff;border-style:solid;color:var(--text); border-color:var(--text)}
  
  /* 页脚 */
  footer{
    margin-top:40px;padding-top:18px;border-top:1px solid var(--border);
    text-align:center;font-size:12.5px;color:var(--faint);
  }
  footer p+p{margin-top:6px}
  footer a{color:var(--muted);text-decoration:none;transition:color .2s}
  footer a:hover{color:var(--text);text-decoration:underline;}
  footer .foot-note{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);font-size:12px;line-height:1.6}
  footer .foot-note b{color:var(--muted);font-weight:600}
  
  /* 底部固定条 */
  .dock{display:none}
  
  /* Toast 提示 */
  #toast{
    position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);
    background:#1e293b; color:#f8fafc;
    padding:10px 20px;border-radius:12px;font-size:13.5px; font-weight: 500;
    box-shadow:0 10px 25px -5px rgba(0,0,0,.3); border: 1px solid rgba(255,255,255,.1);
    opacity:0;pointer-events:none;transition:all .3s cubic-bezier(.22,.68,.32,1.2);z-index:999;
    max-width:calc(100vw - 32px);text-align:center; display: flex; align-items: center; gap: 8px;
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #toast svg { width: 16px; height: 16px; }

  /* 响应式 */
  @media (pointer:coarse){
    .btn{min-height:44px}
    .mini{min-height:34px;padding:6px 12px}
    .copy-btn{min-height:32px}
    .back-link{min-height:36px;margin-top:10px}
    .speed-btn { min-height: 48px; }
  }
  
  @media (max-width:600px){
    .wrap{padding:0 14px 92px}
    .back-link{font-size:13px;margin-top:12px}
    .hero{padding:20px 0 20px}
    .logo{width:52px;height:52px;margin-bottom:12px}
    .hero h1{font-size:24px}
    .sub{font-size:13px}
    .meta{font-size:11px;margin-top:8px;gap:4px}
    .notice{font-size:12px;padding:9px 11px;gap:8px;line-height:1.6}
    .notice svg{width:14px;height:14px;margin-top:2px}
    
    .dl-card{padding:16px;border-radius:16px}
    .dl-top{flex-direction:column;align-items:stretch;gap:14px}
    .dl-info h2{font-size:22px}
    
    .dl-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .btn{padding:10px 12px;font-size:14px}
    .btn:last-child:nth-child(odd) { grid-column: span 2; }
    .btn.fast::after { right: 0; top: -12px; }
    
    .dl-foot{gap:12px;font-size:12px; margin-top:12px;}
    
    .sec-head{margin:30px 0 10px}
    .sec-head h2{font-size:15px}
    .pw{font-size:11.5px}
    
    .search-box{padding:0 10px}
    .search-box input{font-size:16px;padding:10px 6px}
    .search-box input::placeholder{font-size:13.5px}
    
    .ver-item{padding:11px 12px}
    .ver-num{font-size:14px}
    .ver-head{flex-direction:column;align-items:flex-start;gap:8px}
    .ver-btns{width:100%;display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
    .mini{justify-content:center}
    
    .sha-body code{font-size:10px}
    #toast{bottom:calc(82px + env(safe-area-inset-bottom))}
    
    .dock{
      display:flex;align-items:center;gap:12px;
      position:fixed;left:0;right:0;bottom:0;
      padding:9px 14px calc(9px + env(safe-area-inset-bottom));
      background:#fff;
      border-top:1px solid var(--border);z-index:50;
      box-shadow: 0 -4px 20px -10px rgba(0,0,0,.05);
    }
    .dock-info{flex:1;min-width:0}
    .dock-title{display:block;font-size:13.5px;font-weight:650;line-height:1.35}

<div id="toast"></div>

<script>
const API_BASE = 'https://api2.sunwe.dpdns.org';
const REPO_DL = 'https://github.com/Gaoxdwqxql/PlainPad/releases/download';
const MIRROR  = 'https://sunwe.dpdns.org/download/file';
const PAGES   = 'https://plainpad-files.pages.dev';
const API_LATEST = 'https://api.github.com/repos/Gaoxdwqxql/PlainPad/releases/latest';

let versions = [];
let latest = null;
let showAll = false;
let query = '';

const $ = s => document.querySelector(s);
const ghUrl     = v => `${REPO_DL}/v${v}/PlainPad-v${v}.apk`;
const mirrorUrl = v => `${MIRROR}/PlainPad-v${v}.apk`;
const pagesUrl  = v => `${PAGES}/PlainPad-v${v}.apk`;

const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const iconCopy = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>`;
const iconSpeed = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path></svg>`;
const iconRefresh = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"></path><path d="M1 20v-6h6"></path><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>`;

function parseVer(v){
  const s = String(v || '').trim().replace(/^v/i, '');
  const m = s.match(/^(\d+(?:\.\d+)*)(?:-([a-z0-9.]+))?$/i);
  if(!m) return { nums:[0], pre:false, raw:s };
  return { nums:m[1].split('.').map(Number), pre:!!m[2], raw:s };
}
function compareVer(a, b){
  const A = parseVer(a), B = parseVer(b);
  const len = Math.max(A.nums.length, B.nums.length);
  for(let i = 0; i < len; i++){
    const x = A.nums[i] || 0, y = B.nums[i] || 0;
    if(x !== y) return x - y;
  }
  if(A.pre && !B.pre) return -1;
  if(!A.pre && B.pre) return 1;
  return 0;
}

const shaBlock = (sha, small) => {
  if(!sha) return `<div class="sha-missing">此版本发布页暂未提供 SHA-256 校验值</div>`;
  return `
  <details class="${small ? 'ver-sha' : 'sha-wrap'}">
    <summary>SHA-256${small ? '' : ' 校验值'}</summary>
    <div class="sha-body">
      <code>${sha}</code>
      <button class="copy-btn" type="button" data-copy="${sha}">${iconCopy}复制</button>
    </div>
  </details>`;
};

function renderLatest(){
  if (!latest) return;
  
  const dup = versions.slice(1).find(it => it.sha256 && it.sha256 === latest.sha256 && it.version !== latest.version);
  $('#verMeta').textContent = `最新 v${latest.version}`;
  
  const btnsHtml = [
    latest.has_pages ? `<a class="btn btn-pages" data-route="pages" href="${pagesUrl(latest.version)}" target="_blank" rel="noopener" onclick="handleDlClick(this)">官方镜像 1</a>` : '',
    latest.has_mirror ? `<a class="btn btn-mirror" data-route="mirror" href="${mirrorUrl(latest.version)}" target="_blank" rel="noopener" onclick="handleDlClick(this)">官方镜像 2</a>` : '',
    latest.lanzou_url ? `<a class="btn btn-lanzou" href="${latest.lanzou_url}" target="_blank" rel="noopener" onclick="handleDlClick(this)">蓝奏云</a>` : ''
  ].filter(Boolean).join('');

  $('#latest').innerHTML = `
    <div class="dl-card">
      <div class="dl-top">
        <div class="dl-info">
          <span class="badge ${latest.is_pre ? 'badge-pre' : ''}">${latest.is_pre ? '预览版' : '最新版本'}</span>
          <h2>v${latest.version}</h2>
          <p class="dl-note">${latest.note || '包含最新的功能与修复'}</p>
        </div>
      </div>
      <div class="dl-actions" id="btnGroup">
        ${btnsHtml}
      </div>
      
      <!-- 测速模块 -->
      <div class="speed-section">
        <button class="speed-btn" id="speedBtn" type="button">
          <div class="speed-progress" id="speedProgress"></div>
          <span class="speed-text" id="speedText">
            ${iconSpeed} <span>测速并自动选择最快线路</span>
          </span>
        </button>
      </div>
      
      <div class="dl-foot">
        <a class="link-muted" id="ghLink" href="${ghUrl(latest.version)}" target="_blank" rel="noopener">GitHub 直链</a>
      </div>
      ${shaBlock(latest.sha256, false)}
      ${dup ? `<div class="sha-warn">此 SHA-256 与 v${dup.version} 相同，请核对 GitHub Release 页面后再下载。</div>` : ''}
    </div>`;
    
  $('#speedBtn').addEventListener('click', runTest);
}

function normalizeQuery(raw){ return String(raw || '').trim().toLowerCase().replace(/^v/, ''); }

function matchesVersion(item, q){
  if(!q) return true;
  const v = item.version.toLowerCase();
  const vPlain = v.replace(/\./g, '');
  const qPlain = q.replace(/\./g, '');
  const tagText = [item.is_pre ? 'pre 预发布 预览版' : '', item.has_mirror ? '镜像' : '无镜像'].join(' ').toLowerCase();
  return v.includes(q) || (qPlain !== '' && vPlain.includes(qPlain)) || tagText.includes(q);
}

function renderList(){
  const q = normalizeQuery(query);
  const searching = q !== '';
  const matched = versions.filter(it => matchesVersion(it, q));
  const items = searching ? matched : (showAll ? matched : matched.slice(0, 6));
  const moreBtn = $('#moreBtn');

  if(items.length === 0){
    $('#list').innerHTML = `
      <li class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
        <div>没有找到匹配 <b>「${escapeHtml(query.trim())}」</b> 的版本</div>
        <button class="more" style="max-width:200px; margin-top:8px;" onclick="document.getElementById('searchClear').click()">清空搜索</button>
      </li>`;
    moreBtn.style.display = 'none';
    return;
  }

  $('#list').innerHTML = items.map(item => {
    const isLatest = item.version === latest.version;
    const tags = [
      isLatest ? '<span class="tag tag-latest">最新</span>' : '',
      item.is_pre ? '<span class="tag tag-pre">预发布</span>' : '',
      (!item.has_mirror && !item.has_pages && !isLatest) ? '<span class="tag tag-none">无镜像</span>' : ''
    ].join('');

    const btns = [
      item.has_pages ? `<a class="mini mini-pages" href="${pagesUrl(item.version)}" target="_blank" rel="noopener">镜像 1</a>` : '',
      item.has_mirror ? `<a class="mini mini-mirror" href="${mirrorUrl(item.version)}" target="_blank" rel="noopener">镜像 2</a>` : '',
      item.lanzou_url ? `<a class="mini mini-lanzou" href="${item.lanzou_url}" target="_blank" rel="noopener">蓝奏云</a>` : '',
      `<a class="mini mini-gh" href="${ghUrl(item.version)}" target="_blank" rel="noopener">GitHub</a>`
    ].join('');

    return `<li class="ver-item">
      <div class="ver-head">
        <div class="ver-title"><span class="ver-num">v${item.version}</span>${tags}</div>
        <div class="ver-btns">${btns}</div>
      </div>
      ${shaBlock(item.sha256, true)}
    </li>`;
  }).join('');

  if(searching){ moreBtn.style.display = 'none'; }
  else {
    moreBtn.style.display = versions.length > 6 ? '' : 'none';
    moreBtn.textContent = showAll ? '收起' : `展开全部 ${versions.length} 个版本`;
  }
}

function setDock(url, label, type){
  const a = $('#dockDl');
  a.href = url;
  a.classList.remove('btn-pages','btn-mirror','btn-lanzou','fast');
  a.classList.add(type === 'lanzou' ? 'btn-lanzou' : type === 'mirror' ? 'btn-mirror' : 'btn-pages');
  $('#dockSub').textContent = label;
}

function updateDock(){
  if (!latest) return;
  const dock = $('#dock');
  dock.style.display = '';
  
  $('#dockTitle').textContent = `PlainPad v${latest.version}`;
  if (latest.has_pages) {
    setDock(pagesUrl(latest.version), '推荐：官方镜像 1', 'pages');
  } else if (latest.has_mirror) {
    setDock(mirrorUrl(latest.version), '推荐：官方镜像 2', 'mirror');
  } else if (latest.lanzou_url) {
    setDock(latest.lanzou_url, '推荐：蓝奏云', 'lanzou');
  } else {
    setDock(ghUrl(latest.version), 'GitHub 直链', 'pages');
  }
}

window.handleDlClick = function(btn) {
  const originalText = btn.innerHTML;
  const originalBg = btn.style.background;
  btn.style.opacity = '0.8';
  btn.innerHTML = `<span class="spinner spinner-white"></span> 跳转中...`;
  setTimeout(() => {
    btn.style.opacity = '1';
    btn.innerHTML = originalText;
    btn.style.background = originalBg;
  }, 2000);
};

// ==================== 测速逻辑 ====================
const SPEED_KEY = 'ppad_speed_v14';
const SPEED_TTL = 10 * 60 * 1000;

function readSpeedCache(){
  try{
    const raw = sessionStorage.getItem(SPEED_KEY);
    if(!raw) return null;
    const d = JSON.parse(raw);
    if(d.v !== latest.version || Date.now() - d.ts > SPEED_TTL) return null;
    return d.res || null;
  }catch(e){ return null; }
}
function writeSpeedCache(res){
  try{ sessionStorage.setItem(SPEED_KEY, JSON.stringify({ v: latest.version, ts: Date.now(), res })); }catch(e){}
}
function probe(url, timeout){
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeout || 8000);
  const t0 = performance.now();
  return fetch(url, { method:'GET', mode:'no-cors', cache:'no-store', credentials:'omit', headers:{ 'Range':'bytes=0-0' }, signal: ctrl.signal })
    .then(() => ({ ok:true, ms: Math.round(performance.now() - t0) }))
    .catch(() => ({ ok:false, ms:null }))
    .finally(() => clearTimeout(timer));
}

function showResults(res){
  if(!latest) return;
  
  // 重置高亮
  document.querySelectorAll('.btn.fast').forEach(el => el.classList.remove('fast'));
  const ghLink = $('#ghLink');
  if(ghLink) {
    ghLink.classList.remove('fast');
    ghLink.textContent = 'GitHub 直链';
  }
  
  const speedBtn = $('#speedBtn');
  const speedText = $('#speedText');
  const progress = $('#speedProgress');
  
  speedBtn.className = 'speed-btn success';
  speedBtn.disabled = false;
  progress.style.width = '100%';

  const okList = res.filter(r => r.ok).sort((a,b) => a.ms - b.ms);
  const best = okList[0] || null;
  
  if (best) {
    // 显示结果 + 重新测速提示
    speedText.innerHTML = `${iconSpeed} <span><b>${best.name}</b> 最快 (${best.ms}ms)</span> <span class="speed-action">${iconRefresh} 重新测速</span>`;
  } else {
    speedText.innerHTML = `${iconSpeed} <span>线路均不可达，点击重试</span> <span class="speed-action">${iconRefresh} 重新测速</span>`;
  }
  
  // 高亮具体按钮
  if(best) {
    if (best.key === 'github') {
      if(ghLink) {
        ghLink.classList.add('fast');
        ghLink.innerHTML = `⚡ GitHub ${best.ms}ms`;
      }
    } else {
      const targetBtn = document.querySelector(`.btn[data-route="${best.key}"]`);
      if(targetBtn) targetBtn.classList.add('fast');
    }
  }
  
  // 更新 Dock
  if(best && best.key === 'pages'){
    setDock(pagesUrl(latest.version), `最快：官方镜像 1 (${best.ms} ms)`, 'pages');
  }else if(best && best.key === 'mirror'){
    setDock(mirrorUrl(latest.version), `最快：官方镜像 2 (${best.ms} ms)`, 'mirror');
  }else if(best && best.key === 'github'){
    const a = $('#dockDl');
    a.href = ghUrl(latest.version);
    a.classList.remove('btn-pages','btn-mirror','btn-lanzou');
    a.classList.add('btn', 'fast');
    a.style.setProperty('--color-fast', '#10B981');
    $('#dockSub').textContent = `最快：GitHub (${best.ms} ms)`;
  }
}

async function runTest(){
  const btn = $('#speedBtn');
  const speedText = $('#speedText');
  const progress = $('#speedProgress');
  
  if(!btn || btn.disabled || !latest) return;
  
  const targets = [];
  if(latest.has_pages) targets.push({ key:'pages', name:'官方镜像 1', url: pagesUrl(latest.version) });
  if(latest.has_mirror) targets.push({ key:'mirror', name:'官方镜像 2', url: mirrorUrl(latest.version) });
  targets.push({ key:'github', name:'GitHub', url: ghUrl(latest.version) });
  
  // 1. 初始化测速状态
  btn.disabled = true;
  btn.className = 'speed-btn testing';
  progress.style.width = '0%';
  
  let completed = 0;
  const total = targets.length;
  
  const updateProgress = () => {
    completed++;
    const pct = (completed / total) * 100;
    progress.style.width = `${pct}%`;
    speedText.innerHTML = `<span class="spinner"></span> <span>测速中 (${completed}/${total})...</span>`;
  };
  
  speedText.innerHTML = `<span class="spinner"></span> <span>正在连接线路...</span>`;
  
  // 清除旧高亮
  document.querySelectorAll('.btn.fast').forEach(el => el.classList.remove('fast'));
  const ghLink = $('#ghLink');
  if(ghLink) { ghLink.classList.remove('fast'); ghLink.textContent = 'GitHub 直链'; }
  
  // 2. 发起并发测试
  const res = await Promise.all(targets.map(async t => {
    const r = await probe(t.url, 8000);
    updateProgress(); // 每完成一个更新进度
    return { key:t.key, name:t.name, ok:r.ok, ms:r.ms };
  }));
  
  // 3. 渲染最终结果
  showResults(res);
  writeSpeedCache(res);
  
  const ok = res.filter(r => r.ok).sort((a,b) => a.ms - b.ms);
  toast(ok.length ? `测速完成：${ok[0].name} 最快` : '线路均不可达，请稍后重试', ok.length ? 'success' : 'error');
}

const UPD_KEY = 'ppad_upd_v5';
const UPD_TTL = 10 * 60 * 1000;
async function checkUpdate(){
  try{
    const raw = sessionStorage.getItem(UPD_KEY);
    if(raw){
      const c = JSON.parse(raw);
      if(Date.now() - c.ts < UPD_TTL){
        if(c.tag && compareVer(c.tag, latest.version) > 0){
          $('#verMeta').textContent = `最新 v${latest.version} · 有新版 v${c.tag}`;
        }
        return;
      }
    }
  }catch(e){}
  try{
    const res = await fetch(API_LATEST, { headers:{ Accept:'application/vnd.github+json' }, cache:'no-store' });
    if(!res.ok) return;
    const data = await res.json();
    const tag = String(data.tag_name || '').replace(/^v/i, '');
    if(!tag) return;
    try{ sessionStorage.setItem(UPD_KEY, JSON.stringify({ ts:Date.now(), tag, url:data.html_url })); }catch(e){}
    if(compareVer(tag, latest.version) > 0){
      $('#verMeta').textContent = `最新 v${latest.version} · 有新版 v${tag}`;
    }
  }catch(e){}
}

let toastTimer;
function toast(msg, type='info'){
  const el = $('#toast');
  let icon = '';
  if(type === 'success') icon = '<svg viewBox="0 0 24 24" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>';
  if(type === 'error') icon = '<svg viewBox="0 0 24 24" fill="none" stroke="#EF4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>';
  
  el.innerHTML = `${icon}<span>${msg}</span>`;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

async function copyText(text){
  if(navigator.clipboard && window.isSecureContext){ return navigator.clipboard.writeText(text); }
  const ta = document.createElement('textarea');
  ta.value = text; ta.setAttribute('readonly','');
  ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;';
  document.body.appendChild(ta);
  ta.select(); ta.setSelectionRange(0, text.length);
  const ok = document.execCommand('copy');
  document.body.removeChild(ta);
  if(!ok) throw new Error('copy failed');
}

document.addEventListener('click', e => {
  const btn = e.target.closest('[data-copy]');
  if(!btn) return;
  copyText(btn.dataset.copy)
    .then(() => toast('已复制到剪贴板', 'success'))
    .catch(() => toast('复制失败，请手动选中', 'error'));
});

async function initApp(){
  try{
    const res = await fetch(`${API_BASE}/api/releases`);
    if(!res.ok) throw new Error('网络请求失败');
    versions = await res.json();

    if(!versions || versions.length === 0){
      throw new Error('数据库暂无版本记录');
    }

    latest = versions[0];

    renderLatest();
    renderList();
    updateDock();

    $('#moreBtn').addEventListener('click', () => { showAll = !showAll; renderList(); });

    const input = $('#verSearch');
    const clearBtn = $('#searchClear');
    input.addEventListener('input', () => { query = input.value; clearBtn.hidden = !query; renderList(); });
    clearBtn.addEventListener('click', () => {
      input.value = ''; query = ''; clearBtn.hidden = true; input.focus(); renderList();
    });
    input.addEventListener('keydown', e => {
      if(e.key === 'Escape' && input.value){ e.preventDefault(); clearBtn.click(); }
    });
    document.addEventListener('keydown', e => {
      if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){
        e.preventDefault(); input.focus(); input.select();
      }
    });

    const cached = readSpeedCache();
    if(cached){
      showResults(cached);
    }

    checkUpdate();

  }catch(err){
    console.error(err);
    const errHtml = `
      <div class="dl-card" style="border-color: #FECACA; background: #FEF2F2;">
        <div style="text-align:center; padding: 20px 0;">
          <div style="font-size: 32px; margin-bottom: 12px;">⚠️</div>
          <h2 style="color: #991B1B; font-size: 20px; margin-bottom: 8px;">无法连接更新服务器</h2>
          <p style="color: #7F1D1D; font-size: 14px; margin-bottom: 20px;">${err.message || '网络异常'}</p>
          <a href="https://github.com/Gaoxdwqxql/PlainPad/releases" target="_blank" rel="noopener" class="btn" style="background:#EF4444; color:#fff; width: 100%; border:none;">前往 GitHub Releases 下载</a>
        </div>
      </div>
    `;
    $('#latest').innerHTML = errHtml;
    $('#list').innerHTML = `<li class="empty-state">版本列表加载失败，请刷新重试。</li>`;
    $('#dock').style.display = 'none';
    $('#verMeta').textContent = '获取失败';
  }
}

window.addEventListener('DOMContentLoaded', initApp);
</script>
