<style>
  :root {
    --bg: #f8fafc;
    --card: #ffffff;
    --border: #e2e8f0;
    --border-hover: #cbd5e1;
    --text: #0f172a;
    --text-muted: #64748b;
    --text-faint: #94a3b8;
    
    --primary: #0f172a;
    --primary-hover: #1e293b;
    --brand: #3b82f6;
    
    --lanzou-text: #ea580c;
    --lanzou-bg: #fff7ed;
    --lanzou-border: #fed7aa;
    
    --fast: #10b981;
    --fast-bg: #ecfdf5;
    --fast-border: #a7f3d0;
    
    --radius-lg: 14px;
    --radius-md: 10px;
    --radius-sm: 6px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --border-hover: #475569;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --text-faint: #64748b;
      
      --primary: #f8fafc;
      --primary-hover: #e2e8f0;
      --brand: #60a5fa;
      
      --lanzou-text: #fb923c;
      --lanzou-bg: rgba(234, 88, 12, 0.15);
      --lanzou-border: rgba(234, 88, 12, 0.3);
      
      --fast: #34d399;
      --fast-bg: rgba(16, 185, 129, 0.15);
      --fast-border: rgba(16, 185, 129, 0.3);
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
    background: var(--bg);
    transition: background 0.3s, color 0.3s;
  }
  a { color: inherit; }
  button { font-family: inherit; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 18px 56px; }

  /* 返回按钮 */
  .back-link {
    display: inline-flex; align-items: center; gap: 6px;
    margin-top: 18px; padding: 4px 0; font-size: 13px; color: var(--text-faint);
    text-decoration: none; transition: color 0.2s; touch-action: manipulation;
  }
  .back-link svg { width: 14px; height: 14px; flex: none; transition: transform 0.2s; }
  .back-link:hover { color: var(--text-muted); }
  .back-link:hover svg { transform: translateX(-2px); }

  /* 头部 */
  .hero { text-align: center; padding: 26px 0 24px; }
  .logo { width: 58px; height: 58px; margin: 0 auto 14px; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1)); }
  .logo svg { display: block; width: 100%; height: 100%; }
  .hero h1 { font-size: 26px; font-weight: 750; letter-spacing: -0.5px; }
  .sub { color: var(--text-muted); font-size: 14px; margin-top: 4px; }
  .meta { color: var(--text-faint); font-size: 12px; margin-top: 10px; display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .meta span { display: inline-flex; align-items: center; gap: 6px; }
  .meta span + span::before { content: "·"; color: var(--border-hover); }
  .meta a { color: inherit; text-decoration: none; border-bottom: 1px dotted var(--border-hover); transition: all 0.2s; }
  .meta a:hover { color: var(--text-muted); border-bottom-color: var(--text-muted); }

  /* 提示条 */
  .notice {
    display: flex; align-items: flex-start; gap: 9px;
    margin-top: 6px; padding: 11px 14px;
    background: var(--card); border: 1px solid var(--border);
    border-left: 3px solid var(--brand); border-radius: var(--radius-md);
    font-size: 12.5px; color: var(--text-muted); line-height: 1.65;
  }
  .notice svg { flex: none; width: 15px; height: 15px; margin-top: 3px; color: var(--brand); }
  .notice p { margin: 0; }
  .notice strong { color: var(--text); font-weight: 600; }
  .notice a { color: var(--brand); text-decoration: none; font-weight: 500; }
  .notice a:hover { text-decoration: underline; }

  /* 骨架屏 */
  .skeleton { background: var(--border); border-radius: var(--radius-sm); animation: pulse 1.5s infinite ease-in-out; }
  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
  .skeleton-text { height: 16px; margin-bottom: 8px; }
  .skeleton-title { height: 26px; width: 120px; margin-bottom: 12px; }

  /* 最新版卡片 */
  .dl-card {
    margin-top: 12px; background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 22px;
    box-shadow: 0 4px 20px -10px rgba(0,0,0,0.05);
    position: relative; transition: border-color 0.2s;
  }
  .dl-top { display: flex; align-items: center; justify-content: space-between; gap: 18px; flex-wrap: wrap; }
  .badge {
    display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600;
    color: var(--brand); background: var(--bg); border: 1px solid var(--border);
    padding: 2px 9px; border-radius: 999px;
  }
  .badge-pre { color: #d97706; background: #fffbeb; border-color: #fcd34d; }
  @media (prefers-color-scheme: dark) {
    .badge-pre { color: #fbbf24; background: rgba(217,119,6,0.15); border-color: rgba(217,119,6,0.3); }
  }
  .dl-info h2 { font-size: 26px; font-weight: 750; letter-spacing: -0.4px; margin-top: 6px; display: flex; align-items: baseline; gap: 8px; }
  .dl-note { font-size: 13px; color: var(--text-muted); margin-top: 6px; line-height: 1.6; }
  
  /* 下载按钮 */
  .dl-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 11px 20px; border-radius: var(--radius-md); font-size: 14px; font-weight: 600;
    text-decoration: none; border: 1px solid transparent;
    transition: all 0.2s ease; cursor: pointer; touch-action: manipulation; position: relative;
    outline: none;
  }
  .btn:active { transform: scale(0.96); }
  
  /* 主按钮：深色高级感 */
  .btn-primary {
    color: var(--bg); background: var(--primary);
    box-shadow: 0 4px 12px -4px rgba(0,0,0,0.2);
  }
  .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); box-shadow: 0 6px 16px -4px rgba(0,0,0,0.3); }
  
  /* 蓝奏云：低调描边 */
  .btn-lanzou {
    color: var(--lanzou-text); background: var(--lanzou-bg); border-color: var(--lanzou-border);
  }
  .btn-lanzou:hover { filter: brightness(0.95); transform: translateY(-1px); }

  /* 最快线路特效 */
  .btn.fast {
    background: var(--fast) !important;
    color: #fff !important;
    border-color: transparent !important;
    box-shadow: 0 0 0 3px var(--fast-bg), 0 4px 12px -4px rgba(16,185,129,0.5) !important;
    transform: none;
  }
  .btn.fast:hover { transform: translateY(-1px); }
  .btn.fast::after {
    content: "⚡ 最快";
    position: absolute; top: -10px; right: -8px;
    background: var(--card); color: var(--fast);
    font-size: 10px; font-weight: 800;
    padding: 2px 6px; border-radius: var(--radius-sm);
    border: 1px solid var(--fast);
    box-shadow: 0 2px 6px rgba(16,185,129,0.2);
    animation: bounceIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 10;
  }
  @keyframes bounceIn {
    0% { transform: scale(0); opacity: 0; }
    80% { transform: scale(1.1); opacity: 1; }
    100% { transform: scale(1); }
  }

  /* 测速模块：轻量化、扁平化 */
  .speed-section {
    margin-top: 16px; padding-top: 16px; border-top: 1px dashed var(--border);
  }
  .speed-btn {
    position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    width: 100%; padding: 10px; border-radius: var(--radius-md);
    background: var(--bg); border: 1px solid var(--border);
    color: var(--text-muted); font-size: 13px; font-weight: 500;
    cursor: pointer; transition: all 0.2s ease; outline: none; touch-action: manipulation;
  }
  .speed-btn:hover { background: var(--card); border-color: var(--border-hover); color: var(--text); }
  .speed-btn:active { transform: scale(0.98); }
  .speed-btn svg { width: 14px; height: 14px; flex: none; z-index: 2; }
  .speed-text { z-index: 2; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center;}
  
  /* 测速进度条 */
  .speed-progress {
    position: absolute; left: 0; bottom: 0; height: 2px; width: 0%;
    background: var(--brand); transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    z-index: 1;
  }
  
  /* 测速状态 */
  .speed-btn.testing { background: var(--bg); color: var(--brand); border-color: var(--brand); cursor: progress; }
  .speed-btn.testing .speed-progress { background: var(--brand); }
  
  .speed-btn.success { background: var(--fast-bg); border-color: var(--fast-border); color: var(--fast); }
  .speed-btn.success svg { color: var(--fast); }
  .speed-btn.success .speed-progress { background: var(--fast); width: 100% !important; }
  .speed-btn.success b { font-weight: 700; }
  
  /* 重新测速提示 */
  .speed-action {
    font-size: 11px; font-weight: 500; padding: 2px 6px; border-radius: var(--radius-sm);
    background: rgba(0,0,0,0.05); color: var(--text-muted); margin-left: 4px;
    display: inline-flex; align-items: center; gap: 2px;
  }
  @media (prefers-color-scheme: dark) { .speed-action { background: rgba(255,255,255,0.1); } }
  .speed-btn.success .speed-action { background: var(--fast-bg); color: var(--fast); }

  /* 底部辅助链接 */
  .dl-foot {
    display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap;
    margin-top: 16px; font-size: 13px;
  }
  .link-muted {
    color: var(--text-faint); text-decoration: none; background: none; border: 0;

    transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 4px;
  }
  .link-muted:hover { color: var(--text); border-color: var(--text); }
  .link-muted.fast { color: var(--fast) !important; border-bottom: 1px solid var(--fast) !important; font-weight: 600; }

  /* 转圈动画 */
  .spinner {
    width: 14px; height: 14px; border: 2px solid var(--border);
    border-top-color: var(--brand); border-radius: 50%;
    animation: spin 0.8s linear infinite; display: inline-block; margin-right: 4px;
  }
  .spinner-white { border-color: rgba(255,255,255,0.3); border-top-color: #fff; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* SHA 折叠区 */
  .sha-wrap { margin-top: 12px; }
  .sha-wrap summary { list-style: none; cursor: pointer; font-size: 12px; color: var(--text-faint); display: inline-flex; align-items: center; gap: 5px; user-select: none; transition: color 0.2s; }
  .sha-wrap summary::-webkit-details-marker { display: none; }
  .sha-wrap summary::before { content: "▸"; font-size: 10px; transition: transform 0.2s; }
  .sha-wrap[open] summary::before { transform: rotate(90deg); }
  .sha-wrap summary:hover { color: var(--text); }
  .sha-body {
    margin-top: 8px; padding: 10px 12px; background: var(--bg);
    border: 1px solid var(--border); border-radius: var(--radius-md);
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .sha-body code { font-size: 11px; color: var(--text-muted); word-break: break-all; line-height: 1.5; flex: 1; min-width: 160px; }
  .sha-missing {
    margin-top: 10px; font-size: 12px; color: var(--text-faint);
    background: var(--bg); border: 1px dashed var(--border);
    border-radius: var(--radius-md); padding: 8px 12px; display: inline-block;
  }
  .sha-warn {
    margin-top: 10px; font-size: 11.5px; color: #d97706;
    background: #fffbeb; border: 1px solid #fcd34d;
    border-radius: var(--radius-md); padding: 7px 11px; line-height: 1.55;
  }
  @media (prefers-color-scheme: dark) {
    .sha-warn { color: #fbbf24; background: rgba(217,119,6,0.15); border-color: rgba(217,119,6,0.3); }
  }
  .copy-btn {
    font: inherit; font-size: 11.5px; padding: 3px 10px; border-radius: var(--radius-sm);
    border: 1px solid var(--border); background: var(--card); color: var(--text-muted);
    cursor: pointer; flex: none; transition: all 0.2s; display: flex; align-items: center; gap: 4px;
  }
  .copy-btn:hover { color: var(--brand); border-color: var(--brand); }
  .copy-btn:active { transform: scale(0.95); }

  /* 历史版本列表 */
  .sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 40px 0 14px; }
  .sec-head h2 { font-size: 18px; font-weight: 700; }
  .pw { font-size: 12.5px; color: var(--text-faint); display: inline-flex; align-items: center; gap: 6px; }
  .pw b { color: var(--text-muted); font-family: ui-monospace, monospace; letter-spacing: 0.5px; }
  
  .search-box {
    position: relative; display: flex; align-items: center; margin-bottom: 12px;
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-md);
    padding: 0 12px; transition: all 0.2s;
  }
  .search-box:focus-within { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
  .search-box svg { flex: none; color: var(--text-faint); width: 16px; height: 16px; }
  .search-box input {
    flex: 1; border: 0; outline: 0; background: transparent;
    padding: 11px 8px; font: inherit; font-size: 14px; color: var(--text); min-width: 0;
  }
  .search-box input::placeholder { color: var(--text-faint); font-size: 13px; }
  .search-box input::-webkit-search-cancel-button { display: none; }
  .search-clear {
    flex: none; border: 0; background: var(--border); color: var(--text-muted);
    width: 20px; height: 20px; border-radius: 50%; cursor: pointer;
    font-size: 13px; line-height: 1; display: grid; place-items: center;
    padding: 0; transition: all 0.2s;
  }
  .search-clear:hover { background: var(--border-hover); color: var(--text); }

  .ver-list { list-style: none; display: grid; gap: 10px; }
  .ver-item {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-md);
    padding: 14px 16px; transition: border-color 0.2s, box-shadow 0.2s;
  }
  .ver-item:hover { border-color: var(--border-hover); box-shadow: 0 4px 12px -6px rgba(0,0,0,0.05); }
  .ver-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .ver-title { display: flex; align-items: center; gap: 8px; }
  .ver-num { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
  
  .tag { font-size: 10.5px; padding: 1px 7px; border-radius: 999px; font-weight: 500; line-height: 1.7; }
  .tag-latest { background: var(--fast-bg); color: var(--fast); }
  .tag-pre { background: #fffbeb; color: #d97706; }
  @media (prefers-color-scheme: dark) { .tag-pre { background: rgba(217,119,6,0.15); color: #fbbf24; } }
  .tag-none { background: var(--bg); color: var(--text-faint); }
  
  .ver-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .mini {

    text-decoration: none; border: 1px solid var(--border);
    background: var(--card); color: var(--text-muted); transition: all 0.2s;
    white-space: nowrap; display: inline-flex; align-items: center; gap: 4px;
  }
  .mini:hover { background: var(--bg); color: var(--text); border-color: var(--border-hover); }
  .mini:active { transform: scale(0.95); }
  
  .mini-pages { color: var(--brand); border-color: rgba(59,130,246,0.3); background: rgba(59,130,246,0.05); }
  .mini-pages:hover { background: rgba(59,130,246,0.1); color: var(--brand); border-color: var(--brand); }
  
  .mini-mirror { color: var(--brand); border-color: rgba(59,130,246,0.3); background: rgba(59,130,246,0.05); }
  .mini-mirror:hover { background: rgba(59,130,246,0.1); color: var(--brand); border-color: var(--brand); }
  
  .mini-lanzou { color: var(--lanzou-text); border-color: var(--lanzou-border); background: var(--lanzou-bg); }
  .mini-lanzou:hover { filter: brightness(0.95); border-color: var(--lanzou-text); }
  
  .ver-sha { margin-top: 8px; }
  .ver-sha summary { list-style: none; cursor: pointer; font-size: 11.5px; color: var(--text-faint); display: inline-flex; align-items: center; gap: 4px; user-select: none; transition: color 0.2s; }
  .ver-sha summary::-webkit-details-marker { display: none; }
  .ver-sha summary::before { content: "▸"; font-size: 9px; transition: transform 0.2s; }
  .ver-sha[open] summary::before { transform: rotate(90deg); }
  .ver-sha summary:hover { color: var(--text-muted); }
  .ver-sha .sha-body { margin-top: 6px; padding: 8px 10px; }

  .empty-state {
    padding: 40px 20px; text-align: center; color: var(--text-faint); font-size: 14px;
    background: var(--card); border: 1px dashed var(--border); border-radius: var(--radius-lg); list-style: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  }
  .empty-state svg { width: 32px; height: 32px; color: var(--border-hover); }
  .empty-state b { color: var(--text); font-weight: 600; }
  
  .more {
    display: block; width: 100%; margin-top: 12px; padding: 12px; border-radius: var(--radius-md);
    border: 1px dashed var(--border); background: transparent;
    color: var(--text-muted); font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s;
  }
  .more:hover { background: var(--card); border-style: solid; color: var(--text); border-color: var(--border-hover); }
  
  /* 页脚 */
  footer {
    margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--border);
    text-align: center; font-size: 12.5px; color: var(--text-faint);
  }
  footer p + p { margin-top: 8px; }
  footer a { color: var(--text-muted); text-decoration: none; transition: color 0.2s; }
  footer a:hover { color: var(--text); text-decoration: underline; }
  footer .foot-note { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--border); font-size: 12px; line-height: 1.6; }
  footer .foot-note b { color: var(--text-muted); font-weight: 600; }
  
  /* 底部固定条 */
  .dock { display: none; }
  
  /* Toast 提示 */
  #toast {
    position: fixed; left: 50%; bottom: 32px; transform: translate(-50%, 20px);
    background: var(--primary); color: var(--bg);
    padding: 10px 20px; border-radius: var(--radius-md); font-size: 13.5px; font-weight: 500;
    box-shadow: 0 10px 30px -5px rgba(0,0,0,0.3);
    opacity: 0; pointer-events: none; transition: all 0.3s cubic-bezier(0.22, 0.68, 0.32, 1.2); z-index: 999;
    max-width: calc(100vw - 32px); text-align: center; display: flex; align-items: center; gap: 8px;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #toast svg { width: 16px; height: 16px; }

  /* 响应式 */
  @media (pointer: coarse) {
    .btn { min-height: 46px; }
    .mini { min-height: 34px; padding: 6px 12px; }
    .copy-btn { min-height: 32px; }
    .back-link { min-height: 36px; margin-top: 10px; }
    .speed-btn { min-height: 44px; }
  }
  
  @media (max-width: 600px) {
    .wrap { padding: 0 14px 92px; }
    .back-link { font-size: 13px; margin-top: 12px; }
    .hero { padding: 20px 0 20px; }
    .logo { width: 52px; height: 52px; margin-bottom: 12px; }
    .hero h1 { font-size: 24px; }
    .sub { font-size: 13px; }
    .meta { font-size: 11px; margin-top: 8px; gap: 4px; }
    .notice { font-size: 12px; padding: 10px 12px; gap: 8px; line-height: 1.6; }

    .dock .btn { flex: none; padding: 10px 24px; font-size: 14px; border-radius: var(--radius-md); min-height: auto; width: auto; }
  }
</style>

</div>

<div id="toast"></div>

<script>
const API_BASE = 'https://api2.sunwe.dpdns.org';
const REPO_DL = 'https://github.com/Gaoxdwqxql/PlainPad/releases/download';
const MIRROR  = 'https://sunwe.dpdns.org/download/file';
const PAGES   = 'https://plainpad-files.pages.dev';
const API_LATEST = 'https://api.github.com/repos/Gaoxdwqxql/PlainPad/releases/latest';

let versions = [];
let latest = null;
let showAll = false;
let query = '';

const $ = s => document.querySelector(s);
const ghUrl     = v => `${REPO_DL}/v${v}/PlainPad-v${v}.apk`;
const mirrorUrl = v => `${MIRROR}/PlainPad-v${v}.apk`;
const pagesUrl  = v => `${PAGES}/PlainPad-v${v}.apk`;

const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const iconCopy = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>`;
const iconSpeed = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path></svg>`;
const iconRefresh = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"></path><path d="M1 20v-6h6"></path><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>`;

function parseVer(v){
  const s = String(v || '').trim().replace(/^v/i, '');
  const m = s.match(/^(\d+(?:\.\d+)*)(?:-([a-z0-9.]+))?$/i);
  if(!m) return { nums:[0], pre:false, raw:s };
  return { nums:m[1].split('.').map(Number), pre:!!m[2], raw:s };
}
function compareVer(a, b){
  const A = parseVer(a), B = parseVer(b);
  const len = Math.max(A.nums.length, B.nums.length);
  for(let i = 0; i < len; i++){
    const x = A.nums[i] || 0, y = B.nums[i] || 0;
    if(x !== y) return x - y;
  }
  if(A.pre && !B.pre) return -1;
  if(!A.pre && B.pre) return 1;
  return 0;
}

const shaBlock = (sha, small) => {
  if(!sha) return `<div class="sha-missing">此版本发布页暂未提供 SHA-256 校验值</div>`;
  return `
  <details class="${small ? 'ver-sha' : 'sha-wrap'}">
    <summary>SHA-256${small ? '' : ' 校验值'}</summary>
    <div class="sha-body">
      <code>${sha}</code>
      <button class="copy-btn" type="button" data-copy="${sha}">${iconCopy}复制</button>
    </div>
  </details>`;
};

function renderLatest(){
  if (!latest) return;
  
  const dup = versions.slice(1).find(it => it.sha256 && it.sha256 === latest.sha256 && it.version !== latest.version);
  $('#verMeta').textContent = `最新 v${latest.version}`;
  
  const btnsHtml = [
    latest.has_pages ? `<a class="btn btn-primary" data-route="pages" href="${pagesUrl(latest.version)}" target="_blank" rel="noopener" onclick="handleDlClick(this)">官方镜像 1</a>` : '',
    latest.has_mirror ? `<a class="btn btn-primary" data-route="mirror" href="${mirrorUrl(latest.version)}" target="_blank" rel="noopener" onclick="handleDlClick(this)">官方镜像 2</a>` : '',
    latest.lanzou_url ? `<a class="btn btn-lanzou" href="${latest.lanzou_url}" target="_blank" rel="noopener" onclick="handleDlClick(this)">蓝奏云下载</a>` : ''
  ].filter(Boolean).join('');

  $('#latest').innerHTML = `
    <div class="dl-card">
      <div class="dl-top">
        <div class="dl-info">
          <span class="badge ${latest.is_pre ? 'badge-pre' : ''}">${latest.is_pre ? '预览版' : '最新版本'}</span>
          <h2>v${latest.version}</h2>
          <p class="dl-note">${latest.note || '包含最新的功能与修复'}</p>
        </div>
      </div>
      <div class="dl-actions" id="btnGroup">
        ${btnsHtml}
      </div>
      
      <!-- 测速模块 -->
      <div class="speed-section">
        <button class="speed-btn" id="speedBtn" type="button">
          <div class="speed-progress" id="speedProgress"></div>
          <span class="speed-text" id="speedText">
            ${iconSpeed} <span>测速并自动选择最快线路</span>
          </span>
        </button>
      </div>
      
      <div class="dl-foot">
        <a class="link-muted" id="ghLink" href="${ghUrl(latest.version)}" target="_blank" rel="noopener">GitHub 直链</a>
      </div>
      ${shaBlock(latest.sha256, false)}
      ${dup ? `<div class="sha-warn">此 SHA-256 与 v${dup.version} 相同，请核对 GitHub Release 页面后再下载。</div>` : ''}
    </div>`;
    
  $('#speedBtn').addEventListener('click', runTest);
}

function normalizeQuery(raw){ return String(raw || '').trim().toLowerCase().replace(/^v/, ''); }

function matchesVersion(item, q){
  if(!q) return true;
  const v = item.version.toLowerCase();
  const vPlain = v.replace(/\./g, '');
  const qPlain = q.replace(/\./g, '');
  const tagText = [item.is_pre ? 'pre 预发布 预览版' : '', item.has_mirror ? '镜像' : '无镜像'].join(' ').toLowerCase();
  return v.includes(q) || (qPlain !== '' && vPlain.includes(qPlain)) || tagText.includes(q);
}

function renderList(){
  const q = normalizeQuery(query);
  const searching = q !== '';
  const matched = versions.filter(it => matchesVersion(it, q));
  const items = searching ? matched : (showAll ? matched : matched.slice(0, 6));
  const moreBtn = $('#moreBtn');

  if(items.length === 0){
    $('#list').innerHTML = `
      <li class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
        <div>没有找到匹配 <b>「${escapeHtml(query.trim())}」</b> 的版本</div>
        <button class="more" style="max-width:200px; margin-top:8px;" onclick="document.getElementById('searchClear').click()">清空搜索</button>
      </li>`;
    moreBtn.style.display = 'none';
    return;
  }

  $('#list').innerHTML = items.map(item => {
    const isLatest = item.version === latest.version;
    const tags = [
      isLatest ? '<span class="tag tag-latest">最新</span>' : '',
      item.is_pre ? '<span class="tag tag-pre">预发布</span>' : '',
      (!item.has_mirror && !item.has_pages && !isLatest) ? '<span class="tag tag-none">无镜像</span>' : ''
    ].join('');

    const btns = [
      item.has_pages ? `<a class="mini mini-pages" href="${pagesUrl(item.version)}" target="_blank" rel="noopener">镜像 1</a>` : '',
      item.has_mirror ? `<a class="mini mini-mirror" href="${mirrorUrl(item.version)}" target="_blank" rel="noopener">镜像 2</a>` : '',
      item.lanzou_url ? `<a class="mini mini-lanzou" href="${item.lanzou_url}" target="_blank" rel="noopener">蓝奏云</a>` : '',
      `<a class="mini mini-gh" href="${ghUrl(item.version)}" target="_blank" rel="noopener">GitHub</a>`
    ].join('');

    return `<li class="ver-item">
      <div class="ver-head">
        <div class="ver-title"><span class="ver-num">v${item.version}</span>${tags}</div>
        <div class="ver-btns">${btns}</div>
      </div>
      ${shaBlock(item.sha256, true)}
    </li>`;
  }).join('');

  if(searching){ moreBtn.style.display = 'none'; }
  else {
    moreBtn.style.display = versions.length > 6 ? '' : 'none';
    moreBtn.textContent = showAll ? '收起' : `展开全部 ${versions.length} 个版本`;
  }
}

function setDock(url, label, type){
  const a = $('#dockDl');
  a.href = url;
  a.className = 'btn ' + (type === 'lanzou' ? 'btn-lanzou' : 'btn-primary'); // 重置样式
  if ($('#dockDl.fast')) $('#dockDl').classList.remove('fast');
  $('#dockSub').textContent = label;
}

function updateDock(){
  if (!latest) return;
  const dock = $('#dock');
  dock.style.display = '';
  
  $('#dockTitle').textContent = `PlainPad v${latest.version}`;
  if (latest.has_pages) {
    setDock(pagesUrl(latest.version), '推荐：官方镜像 1', 'pages');
  } else if (latest.has_mirror) {
    setDock(mirrorUrl(latest.version), '推荐：官方镜像 2', 'mirror');
  } else if (latest.lanzou_url) {
    setDock(latest.lanzou_url, '推荐：蓝奏云', 'lanzou');
  } else {
    setDock(ghUrl(latest.version), 'GitHub 直链', 'pages');
  }
}

window.handleDlClick = function(btn) {
  const originalText = btn.innerHTML;
  btn.style.opacity = '0.8';
  btn.innerHTML = `<span class="spinner spinner-white"></span> 跳转中...`;
  setTimeout(() => {
    btn.style.opacity = '1';
    btn.innerHTML = originalText;
  }, 2000);
};

// ==================== 测速逻辑 ====================
const SPEED_KEY = 'ppad_speed_v16';
const SPEED_TTL = 10 * 60 * 1000;

function readSpeedCache(){
  try{
    const raw = sessionStorage.getItem(SPEED_KEY);
    if(!raw) return null;
    const d = JSON.parse(raw);
    if(d.v !== latest.version || Date.now() - d.ts > SPEED_TTL) return null;
    return d.res || null;
  }catch(e){ return null; }
}
function writeSpeedCache(res){
  try{ sessionStorage.setItem(SPEED_KEY, JSON.stringify({ v: latest.version, ts: Date.now(), res })); }catch(e){}
}
function probe(url, timeout){
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeout || 8000);
  const t0 = performance.now();
  return fetch(url, { method:'GET', mode:'no-cors', cache:'no-store', credentials:'omit', headers:{ 'Range':'bytes=0-0' }, signal: ctrl.signal })
    .then(() => ({ ok:true, ms: Math.round(performance.now() - t0) }))
    .catch(() => ({ ok:false, ms:null }))
    .finally(() => clearTimeout(timer));
}

function showResults(res){
  if(!latest) return;
  
  document.querySelectorAll('.btn.fast').forEach(el => el.classList.remove('fast'));
  const ghLink = $('#ghLink');
  if(ghLink) {
    ghLink.classList.remove('fast');
    ghLink.textContent = 'GitHub 直链';
  }
  
  const speedBtn = $('#speedBtn');
  const speedText = $('#speedText');
  const progress = $('#speedProgress');
  
  speedBtn.className = 'speed-btn success';
  speedBtn.disabled = false;
  progress.style.width = '100%';

  const okList = res.filter(r => r.ok).sort((a,b) => a.ms - b.ms);
  const best = okList[0] || null;
  
  if (best) {
    speedText.innerHTML = `${iconSpeed} <span><b>${best.name}</b> 最快 (${best.ms}ms)</span> <span class="speed-action">${iconRefresh} 重测</span>`;
  } else {
    speedText.innerHTML = `${iconSpeed} <span>线路均不可达，点击重试</span> <span class="speed-action">${iconRefresh} 重测</span>`;
  }
  
  if(best) {
    if (best.key === 'github') {
      if(ghLink) {
        ghLink.classList.add('fast');
        ghLink.innerHTML = `⚡ GitHub ${best.ms}ms`;
      }
    } else {
      const targetBtn = document.querySelector(`.btn[data-route="${best.key}"]`);
      if(targetBtn) targetBtn.classList.add('fast');
    }
  }
  
  if(best && best.key === 'pages'){
    setDock(pagesUrl(latest.version), `最快：官方镜像 1 (${best.ms} ms)`, 'pages');
  }else if(best && best.key === 'mirror'){
    setDock(mirrorUrl(latest.version), `最快：官方镜像 2 (${best.ms} ms)`, 'mirror');
  }else if(best && best.key === 'github'){
    const a = $('#dockDl');
    a.href = ghUrl(latest.version);
    a.className = 'btn fast';
    $('#dockSub').textContent = `最快：GitHub (${best.ms} ms)`;
  }
}

async function runTest(){
  const btn = $('#speedBtn');
  const speedText = $('#speedText');
  const progress = $('#speedProgress');
  
  if(!btn || btn.disabled || !latest) return;
  
  const targets = [];
  if(latest.has_pages) targets.push({ key:'pages', name:'官方镜像 1', url: pagesUrl(latest.version) });
  if(latest.has_mirror) targets.push({ key:'mirror', name:'官方镜像 2', url: mirrorUrl(latest.version) });
  targets.push({ key:'github', name:'GitHub', url: ghUrl(latest.version) });
  
  btn.disabled = true;
  btn.className = 'speed-btn testing';
  progress.style.width = '0%';
  
  let completed = 0;
  const total = targets.length;
  
  const updateProgress = () => {
    completed++;
    const pct = (completed / total) * 100;
    progress.style.width = `${pct}%`;
    speedText.innerHTML = `<span class="spinner"></span> <span>测速中 (${completed}/${total})...</span>`;
  };
  
  speedText.innerHTML = `<span class="spinner"></span> <span>正在连接线路...</span>`;
  
  document.querySelectorAll('.btn.fast').forEach(el => el.classList.remove('fast'));
  const ghLink = $('#ghLink');
  if(ghLink) { ghLink.classList.remove('fast'); ghLink.textContent = 'GitHub 直链'; }
  
  const res = await Promise.all(targets.map(async t => {
    const r = await probe(t.url, 8000);
    updateProgress();
    return { key:t.key, name:t.name, ok:r.ok, ms:r.ms };
  }));
  
  showResults(res);
  writeSpeedCache(res);
  
  const ok = res.filter(r => r.ok).sort((a,b) => a.ms - b.ms);
  toast(ok.length ? `测速完成：${ok[0].name} 最快` : '线路均不可达，请稍后重试', ok.length ? 'success' : 'error');
}

const UPD_KEY = 'ppad_upd_v5';
const UPD_TTL = 10 * 60 * 1000;
async function checkUpdate(){
  try{
    const raw = sessionStorage.getItem(UPD_KEY);
    if(raw){
      const c = JSON.parse(raw);
      if(Date.now() - c.ts < UPD_TTL){
        if(c.tag && compareVer(c.tag, latest.version) > 0){
          $('#verMeta').textContent = `最新 v${latest.version} · 有新版 v${c.tag}`;
        }
        return;
      }
    }
  }catch(e){}
  try{
    const res = await fetch(API_LATEST, { headers:{ Accept:'application/vnd.github+json' }, cache:'no-store' });
    if(!res.ok) return;
    const data = await res.json();
    const tag = String(data.tag_name || '').replace(/^v/i, '');
    if(!tag) return;
    try{ sessionStorage.setItem(UPD_KEY, JSON.stringify({ ts:Date.now(), tag, url:data.html_url })); }catch(e){}
    if(compareVer(tag, latest.version) > 0){
      $('#verMeta').textContent = `最新 v${latest.version} · 有新版 v${tag}`;
    }
  }catch(e){}
}

let toastTimer;
function toast(msg, type='info'){
  const el = $('#toast');
  let icon = '';
  if(type === 'success') icon = '<svg viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>';
  if(type === 'error') icon = '<svg viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>';
  
  el.innerHTML = `${icon}<span>${msg}</span>`;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

async function copyText(text){
  if(navigator.clipboard && window.isSecureContext){ return navigator.clipboard.writeText(text); }
  const ta = document.createElement('textarea');
  ta.value = text; ta.setAttribute('readonly','');
  ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;';
  document.body.appendChild(ta);
  ta.select(); ta.setSelectionRange(0, text.length);
  const ok = document.execCommand('copy');
  document.body.removeChild(ta);
  if(!ok) throw new Error('copy failed');
}

document.addEventListener('click', e => {
  const btn = e.target.closest('[data-copy]');
  if(!btn) return;
  copyText(btn.dataset.copy)
    .then(() => toast('已复制到剪贴板', 'success'))
    .catch(() => toast('复制失败，请手动选中', 'error'));
});

async function initApp(){
  try{
    const res = await fetch(`${API_BASE}/api/releases`);
    if(!res.ok) throw new Error('网络请求失败');
    versions = await res.json();

    if(!versions || versions.length === 0){
      throw new Error('数据库暂无版本记录');
    }

    latest = versions[0];

    renderLatest();
    renderList();
    updateDock();

    $('#moreBtn').addEventListener('click', () => { showAll = !showAll; renderList(); });

    const input = $('#verSearch');
    const clearBtn = $('#searchClear');
    input.addEventListener('input', () => { query = input.value; clearBtn.hidden = !query; renderList(); });
    clearBtn.addEventListener('click', () => {
      input.value = ''; query = ''; clearBtn.hidden = true; input.focus(); renderList();
    });
    input.addEventListener('keydown', e => {
      if(e.key === 'Escape' && input.value){ e.preventDefault(); clearBtn.click(); }
    });
    document.addEventListener('keydown', e => {
      if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){
        e.preventDefault(); input.focus(); input.select();
      }
    });

    const cached = readSpeedCache();
    if(cached){
      showResults(cached);
    }

    checkUpdate();

  }catch(err){
    console.error(err);
    const errHtml = `
      <div class="dl-card" style="border-color: #fca5a5; background: #fef2f2;">
        <div style="text-align:center; padding: 20px 0;">
          <div style="font-size: 32px; margin-bottom: 12px;">⚠️</div>
          <h2 style="color: #991b1b; font-size: 20px; margin-bottom: 8px;">无法连接更新服务器</h2>
          <p style="color: #7f1d1d; font-size: 14px; margin-bottom: 20px;">${err.message || '网络异常'}</p>
          <a href="https://github.com/Gaoxdwqxql/PlainPad/releases" target="_blank" rel="noopener" class="btn" style="background:#ef4444; color:#fff; width: 100%; border:none;">前往 GitHub Releases 下载</a>
        </div>
      </div>
    `;
    $('#latest').innerHTML = errHtml;
    $('#list').innerHTML = `<li class="empty-state">版本列表加载失败，请刷新重试。</li>`;
    $('#dock').style.display = 'none';
    $('#verMeta').textContent = '获取失败';
  }
}

window.addEventListener('DOMContentLoaded', initApp);
</script>
